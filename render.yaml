# Render Blueprint Specification for Voice Print Model Generator
# See https://render.com/docs/blueprint-spec for details

services:
  # ---------------------------------------------------------------------------
  # 1. Backend Web Service (Docker / FastAPI / PyTorch)
  # ---------------------------------------------------------------------------
  - type: web
    name: voiceprint-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHONUNBUFFERED
        value: "1"

  # ---------------------------------------------------------------------------
  # 2. Frontend Static Site (React / Vite)
  # ---------------------------------------------------------------------------
  - type: web
    name: voiceprint-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: voiceprint-backend
          property: host
    routes:
      - type: rewrite
        source: /pitch-deck
        destination: /pitch-deck.html
      - type: rewrite
        source: /pitchdeck
        destination: /pitchdeck.html
      - type: rewrite
        source: /pitchdech
        destination: /pitchdech.html
      - type: rewrite
        source: /*
        destination: /index.html
